<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars"></div>

    <!-- Auth Container -->
    <div id="authContainer" class="container">
        <h1>Welcome to Petro</h1>
        <div id="loginForm">
            <h2>Login</h2>
            <input type="text" id="pinInput" placeholder="Enter your 6-digit PIN">
            <button id="loginButton">Login</button>
            <p>Don't have a PIN? <a href="#" id="showRegister">Register here</a>.</p>
        </div>
        <div id="registerForm" class="hidden">
            <h2>Register</h2>
            <p>Click the button below to get a new PIN.</p>
            <button id="registerButton">Register</button>
            <p id="newPinSection" class="hidden">Your new PIN is: <strong id="newPin"></strong></p>
            <p>Already have a PIN? <a href="#" id="showLogin">Login here</a>.</p>
        </div>
        <p id="authError" class="error-message"></p>
    </div>

    <!-- Game Container (Initially Hidden) -->
    <div id="gameContainer" class="container hidden">
        <div id="mainMenu">
            <button onclick="showShop()">Shop</button>
            <button onclick="showInventory()">Inventory</button>
            <!-- Game content will be dynamically added here -->
        </div>

        <div id="shop" class="hidden">
            <h2>Shop</h2>
            <button onclick="showMainMenu()">Back to Main Menu</button>
            <!-- Shop content -->
        </div>

        <div id="inventory" class="hidden">
            <h2>Inventory</h2>
            <button onclick="showMainMenu()">Back to Main Menu</button>
            <!-- Inventory content -->
        </div>
        
        <div id="game-output"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
