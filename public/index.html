<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars"></div>
    
    <!-- Auth Container -->
    <div id="authContainer" class="container">
        <h1>Welcome to Petro</h1>
        <div id="loginForm">
            <h2>Login</h2>
            <input type="text" id="pinInput" placeholder="Enter your 6-digit PIN">
            <button id="loginButton">Login</button>
            <p>Don't have a PIN? <a href="#" id="showRegister">Register here</a>.</p>
        </div>
        <div id="registerForm" class="hidden">
            <h2>Register</h2>
            <p>Click the button below to get a new PIN.</p>
            <button id="registerButton">Register</button>
            <p id="newPinSection" class="hidden">Your new PIN is: <strong id="newPin"></strong></p>
            <p>Already have a PIN? <a href="#" id="showLogin">Login here</a>.</p>
        </div>
        <p id="authError" class="error-message"></p>
    </div>
    
    <!-- Game Container (Initially Hidden) -->
    <div id="gameContainer" class="container hidden">
        <header>
            <div id="playerStats">
                <span>Money: <span id="money">-</span></span>
                <span>Stage: <span id="stage">-</span></span>
            </div>
            <nav>
                <button id="navShop">Shop</button>
                <button id="navInventory">Inventory</button>
                <button id="navFight">Fight</button>
            </nav>
        </header>
        
        <main id="mainContent">
            <!-- Shop View -->
            <div id="shopView" class="view hidden">
                <h2>Shop</h2>
                <div id="shopItems" class="item-grid"></div>
                <p id="shopError" class="error-message"></p>
            </div>
            
            <!-- Inventory View -->
            <div id="inventoryView" class="view hidden">
                <h2>Your Pets</h2>
                <div id="inventoryItems" class="item-grid"></div>
            </div>
            
            <!-- Fight View -->
            <div id="fightView" class="view hidden">
                <h2>Prepare for Battle!</h2>
                <!-- Fight UI will go here -->
            </div>
        </main>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
